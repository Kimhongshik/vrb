<title>레몬헬스케어 공공사업 관리</title>
<style>
  /* 사이트 디자인 테마 4종 — 전체 관리에서 선택하면 JS가 <html data-theme="..."> 를 갱신합니다.
     의미색(success/warn/crit/info)은 테마와 무관하게 역할이 고정되고, 테마별로 미세 조정만 됩니다.
     기본값(속성 미지정 시)은 블랙입니다. */
  :root, :root[data-theme="black"]{
    --ink:#E7E9EC; --paper:#0A0B0D; --panel:#15171B; --line:#262A31; --muted:#8B909B;
    --teal:#3FBFAE; --teal-soft:#12302C; --teal-ink:#8FE0D2;
    --lemon:#D9C43C; --lemon-soft:#2E2A11; --lemon-ink:#EDE07A;
    --info:#6FA8F5; --info-soft:#16233A;
    --success:#4ADE94; --success-soft:#133326;
    --warn:#F5B94D; --warn-soft:#362A12;
    --crit:#F2776D; --crit-soft:#391B18;
    --violet:#B49AF0; --violet-soft:#291F3E;
  }
  :root[data-theme="red"]{
    --ink:#F0E9E9; --paper:#100A0A; --panel:#1C1213; --line:#332224; --muted:#9C8A8B;
    --teal:#C23B4E; --teal-soft:#3A1418; --teal-ink:#F0929E;
    --lemon:#E8A23C; --lemon-soft:#332210; --lemon-ink:#F2C077;
    --info:#6FA8F5; --info-soft:#16233A;
    --success:#4ADE94; --success-soft:#133326;
    --warn:#F5B94D; --warn-soft:#362A12;
    --crit:#FF5C5C; --crit-soft:#3D1414;
    --violet:#B49AF0; --violet-soft:#291F3E;
  }
  :root[data-theme="white"]{
    --ink:#1A1D21; --paper:#FFFFFF; --panel:#F7F8FA; --line:#E2E5E9; --muted:#6B7280;
    --teal:#0D9488; --teal-soft:#E6F6F4; --teal-ink:#0B6B62;
    --lemon:#A8B400; --lemon-soft:#F4F7D6; --lemon-ink:#5C6300;
    --info:#2563EB; --info-soft:#E8EFFD;
    --success:#16A34A; --success-soft:#E7F7ED;
    --warn:#D97706; --warn-soft:#FCF1DE;
    --crit:#DC2626; --crit-soft:#FCE8E8;
    --violet:#7C3AED; --violet-soft:#F0E9FD;
  }
  :root[data-theme="navy"]{
    --ink:#E5EBF5; --paper:#0A0E17; --panel:#141A26; --line:#232B3D; --muted:#8A94AC;
    --teal:#3B82F6; --teal-soft:#132038; --teal-ink:#93BBFB;
    --lemon:#D9C43C; --lemon-soft:#2E2A11; --lemon-ink:#EDE07A;
    --info:#38BDF8; --info-soft:#0F2333;
    --success:#34D399; --success-soft:#0F2B22;
    --warn:#FBBF24; --warn-soft:#332710;
    --crit:#F87171; --crit-soft:#341717;
    --violet:#A78BFA; --violet-soft:#241C3D;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-family:"Cascadia Mono","Consolas",ui-monospace,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  .app{max-width:1360px;margin:0 auto;padding:0 24px 64px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:18px;
    position:sticky;top:0;background:var(--paper);z-index:5;
  }
  .brandmark{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:none;padding:0;}
  .brandmark svg{display:block;flex:none;}
  .brandmark .word{display:flex;flex-direction:column;gap:1px;text-align:left;}
  .brandmark .word b{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .brandmark .word span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}

  .modnav{display:flex;gap:4px;flex-wrap:wrap;}
  .modnav button{appearance:none;border:1px solid transparent;background:none;color:var(--muted);padding:8px 12px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .modnav button:hover{color:var(--ink);background:var(--panel);}
  .modnav button.active{color:var(--teal-ink);background:var(--teal-soft);}
  .modnav button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}

  .topbar .rightlinks{display:flex;align-items:center;gap:10px;}
  .textbtn{appearance:none;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .textbtn:hover{color:var(--ink);}

  .view{display:none;}
  .view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(2px);}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.view.active{animation:none;}}

  /* ---------- intro ---------- */
  .hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:34px 0 26px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .hero svg{flex:none;}
  .hero h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.015em;text-wrap:balance;}
  .hero .eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);font-weight:800;margin-bottom:6px;}
  .hero p{margin:0;color:var(--muted);font-size:13.5px;max-width:56ch;}

  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  @media (max-width:880px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .kpi .k{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .kpi .d{font-size:11px;color:var(--muted);margin-top:4px;}

  .modgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:980px){.modgrid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.modgrid{grid-template-columns:1fr;}}
  .modcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s, transform .15s;}
  .modcard:hover{border-color:var(--teal);transform:translateY(-1px);}
  .modcard:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .modcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .modcard h3{margin:0;font-size:15.5px;font-weight:800;}
  .modcard .count{font-size:20px;font-weight:800;color:var(--teal-ink);white-space:nowrap;}
  .modcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55;}
  .modcard .go{font-size:12px;font-weight:700;color:var(--teal-ink);margin-top:auto;}

  /* ---------- panels / forms ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{margin:0 0 3px;font-size:15px;font-weight:700;}
  .panel .sub{margin:0 0 14px;color:var(--muted);font-size:12.5px;}
  .panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px;}

  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600;}
  .field label .req{color:var(--crit);}
  .field input, .field select, .field textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);width:100%;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .field .hint{font-size:11px;color:var(--muted);}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);}
  .btn.ghost{background:transparent;}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .twrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  table{border-collapse:collapse;width:100%;min-width:600px;font-size:12.8px;}
  thead th{position:sticky;top:0;background:var(--teal-soft);color:var(--teal-ink);text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper);}
  tr.subtotal td{background:var(--teal-soft);font-weight:700;color:var(--teal-ink);}
  td.right,th.right{text-align:right;}
  td.center,th.center{text-align:center;}
  .empty-row td{color:var(--muted);text-align:center;padding:18px;}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill.success{background:var(--success-soft);color:var(--success);}
  .pill.warn{background:var(--warn-soft);color:var(--warn);}
  .pill.crit{background:var(--crit-soft);color:var(--crit);}
  .pill.info{background:var(--info-soft);color:var(--info);}
  .pill.violet{background:var(--violet-soft);color:var(--violet);}
  .pill.draft{background:var(--line);color:var(--muted);}

  .periodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .periodbar .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .periodbar .seg button{appearance:none;border:none;background:var(--panel);color:var(--muted);padding:7px 13px;font-size:12.3px;font-weight:700;cursor:pointer;}
  .periodbar .seg button.active{background:var(--teal);color:var(--paper);}
  .periodbar .seg button.active.booking{background:var(--violet);}
  .periodbar input[type=date]{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);font-size:12.3px;}
  .periodbar .label{font-size:11.5px;color:var(--muted);font-weight:600;}

  .donutwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;}
  @media (max-width:640px){.donutwrap{grid-template-columns:1fr;justify-items:center;}}
  .donut-legend{display:flex;flex-direction:column;gap:7px;}
  .donut-legend .row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .donut-legend .sw{width:10px;height:10px;border-radius:3px;flex:none;}
  .donut-legend .row b{margin-left:auto;font-variant-numeric:tabular-nums;font-family:"Cascadia Mono","Consolas",ui-monospace,monospace;}

  .linkbtn{background:none;border:none;color:var(--teal-ink);font-weight:700;font-size:12.3px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
  .linkbtn:hover{color:var(--ink);}
  .iconbtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;padding:4px 8px;cursor:pointer;}
  .iconbtn:hover{color:var(--crit);border-color:var(--crit);}

  .projlist{display:flex;flex-direction:column;gap:8px;}
  .projrow{display:grid;grid-template-columns:110px 1.4fr 1fr 110px 130px 90px;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;}
  .projrow:hover{border-color:var(--teal);}
  .projrow .code{font-size:11px;color:var(--muted);font-weight:700;}
  .projrow .name{font-weight:700;font-size:13px;}
  .projrow .client{font-size:12px;color:var(--muted);}
  @media (max-width:900px){.projrow{grid-template-columns:1fr;gap:4px;}}

  .backline{display:flex;align-items:center;gap:8px;margin-bottom:10px;}

  .milestones{display:flex;flex-direction:column;gap:0;}
  .ms-row{display:grid;grid-template-columns:120px 160px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);}
  .ms-row:last-child{border-bottom:none;}
  .ms-row .lbl{font-size:12.5px;font-weight:700;color:var(--muted);}
  .ms-row input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);}
  .filechip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-ink);padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .filechip button{background:none;border:none;color:inherit;cursor:pointer;font-weight:800;padding:0;}
  .fileinput-label{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;}
  .fileinput-label input{display:none;}
  .ms-row.ms-cw{grid-template-columns:110px 1fr 160px auto;}
  .ms-row.ms-4col{grid-template-columns:110px 1.4fr 1fr auto;}
  .ms-row.ms-3col{grid-template-columns:110px 1fr 140px;}
  .ms-row.ms-2col{grid-template-columns:110px 1fr;}
  @media (max-width:760px){.ms-row,.ms-row.ms-cw,.ms-row.ms-4col,.ms-row.ms-3col,.ms-row.ms-2col{grid-template-columns:1fr;gap:4px;}}

  .costcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:4px;}
  @media (max-width:900px){.costcards{grid-template-columns:repeat(2,1fr);}}
  .costcard{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px;}
  .costcard .k{font-size:10.8px;color:var(--muted);font-weight:700;margin-bottom:5px;}
  .costcard .v{font-size:17px;font-weight:800;}
  .costcard .d{font-size:10.8px;color:var(--muted);margin-top:4px;}
  .costcard.margin-pos .v{color:var(--success);}
  .costcard.margin-neg .v{color:var(--crit);}

  .inline-add{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:9px;margin-bottom:12px;}
  .inline-add.wide{grid-template-columns:1fr 1fr 160px auto;}
  .inline-add.indirect{grid-template-columns:1fr 90px 120px 1fr auto;}
  @media (max-width:900px){.inline-add,.inline-add.wide,.inline-add.indirect{grid-template-columns:1fr;}}

  /* ---------- project detail: mode + subtabs ---------- */
  .modetabs{display:flex;gap:8px;margin-bottom:16px;}
  .modetabs button{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13.5px;cursor:pointer;color:var(--muted);text-align:left;}
  .modetabs button .t{display:block;}
  .modetabs button .s{display:block;font-size:11px;font-weight:600;margin-top:2px;color:var(--muted);}
  .modetabs button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .modetabs button.active.mi{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal);}
  .modetabs button.active.mi .s{color:var(--teal-ink);}
  .modetabs button.active.mo{background:var(--info-soft);color:var(--info);border-color:var(--info);}
  .modetabs button.active.mo .s{color:var(--info);}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subtabs button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;}
  .subtabs button:hover{color:var(--ink);}
  .subtabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .subtabs button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}

  .matrixbar{display:inline-block;height:6px;border-radius:999px;background:var(--teal);}

  footer.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;}

  .skill-grid{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);}
  .skill-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--panel);user-select:none;}
  .skill-chip input{width:13px;height:13px;accent-color:var(--teal);}
  .skill-chip.checked, .skill-chip:has(input:checked){background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink);}

  /* ---------- toast / confirm modal ---------- */
  #toastHost{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .18s ease, transform .18s ease;max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.warn{background:var(--crit);}
  .confirm-overlay{position:fixed;inset:0;background:rgba(10,14,13,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;}
  .confirm-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .confirm-box p{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:var(--ink);}
  .confirm-box .btnrow{margin-top:0;justify-content:flex-end;}

  /* ---------- mobile ---------- */
  @media (max-width:640px){
    .app{padding:0 12px 40px;}
    .topbar{padding:10px 0;gap:8px;}
    .brandmark .word b{font-size:13px;}
    .brandmark .word span{font-size:9.5px;}
    .modnav{gap:2px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    .modnav button{padding:7px 9px;font-size:11.5px;white-space:nowrap;flex:none;}
    .rightlinks{width:100%;justify-content:space-between;}
    .hero{padding:20px 0 16px;gap:14px;}
    .hero h1{font-size:20px;}
    .kpi-strip{grid-template-columns:1fr;}
    .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}
    .costcards{grid-template-columns:1fr;}
    .modgrid{grid-template-columns:1fr;}
    .modetabs{flex-direction:column;}
    .subtabs{gap:4px;}
    .subtabs button{padding:6px 10px;font-size:11px;}
    .panel{padding:14px 14px;}
    .donutwrap{grid-template-columns:1fr;justify-items:center;text-align:center;}
    .donut-legend{width:100%;max-width:260px;}
    .periodbar{gap:6px;}
    .periodbar .seg button{padding:6px 10px;font-size:11.5px;}
    table{font-size:11.5px;}
    thead th, tbody td{padding:6px 8px;}
  }
  @media (max-width:420px){
    .kpi .v{font-size:18px;}
    .modcard .count{font-size:17px;}
  }
</style>

<!-- 엑셀 다운로드/업로드 기능용 라이브러리. claude.ai 아티팩트 미리보기는 CSP로 외부 스크립트를 막아 이 부분만 동작하지 않고,
     GitHub Pages(kimhongshik.github.io/vrb) 등 실제 호스팅 환경에서는 정상 로드됩니다. 로드 실패 시 앱은 정상 동작하며
     엑셀 버튼을 누르면 안내 메시지만 표시됩니다(아래 xlsxAvailable() 가드 참고). -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<div class="app" id="app"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var LOGO_SVG = '<svg width="__SIZE__" height="__SIZE__" viewBox="0 0 40 40" aria-hidden="true">' +
    '<circle cx="20" cy="20" r="18" fill="var(--teal)"></circle>' +

  function monthsBetween(s,e){
    if(!s||!e) return 1;
    var sd=new Date(s), ed=new Date(e);
    var m=(ed.getFullYear()-sd.getFullYear())*12+(ed.getMonth()-sd.getMonth())+1;
    return Math.max(1,m);
  }
  function monthKeyOf(dstr){ var d=new Date(dstr); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function enumerateMonths(s,e){
    var res=[]; if(!s||!e) return res;
    var cur=new Date(s); cur.setDate(1);
    var end=new Date(e); end.setDate(1);
    var guard=0;
    while(cur<=end && guard<600){ res.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')); cur.setMonth(cur.getMonth()+1); guard++; }
    return res;
  }

  function empSgaRate(emp){ return (emp.sgaRate!==''&&emp.sgaRate!=null) ? Number(emp.sgaRate) : Number(S.settings.defaultSgaRate); }
  function empMonthlySgaInclusive(emp){
    return emp.sgaType==='fixed' ? (numOr0(emp.unitPrice)+numOr0(emp.sgaFixedAmount)) : Math.round(numOr0(emp.unitPrice)*(1+empSgaRate(emp)/100));
  }

  function computeAssignment(a,p){
    var emp = employee(a.employeeId);
    if(!emp) return {monthlyLabor:0,totalLabor:0,sga:0,total:0,months:0,rate:0,sgaMode:'percent'};
    var months = monthsBetween(p.startDate,p.endDate);
    var monthlyLabor = emp.unitPrice * (numOr0(a.ratio)/100);
    var totalLabor = monthlyLabor*months;
    var sga, rate, sgaMode;
    if(p.sgaRate!==''&&p.sgaRate!=null){
      rate = Number(p.sgaRate); sgaMode='percent(프로젝트 지정)';
      sga = totalLabor*(rate/100);
    } else if(emp.sgaType==='fixed'){
      rate = 0; sgaMode='fixed';
      sga = numOr0(emp.sgaFixedAmount)*months;
    } else {
      rate = empSgaRate(emp); sgaMode='percent';
      sga = totalLabor*(rate/100);
    }
    return {monthlyLabor:monthlyLabor,totalLabor:totalLabor,sga:sga,total:totalLabor+sga,months:months,rate:rate,sgaMode:sgaMode};
  }

  function projectRevenue(p){
    var full = p.contractAmount!=null? p.contractAmount : 0;
    if(p.consortium && p.consortium.isConsortium && p.consortium.members && p.consortium.members.length){
      var ours = p.consortium.members.filter(function(m){return m.partnerId===null||m.partnerId===undefined;})[0];
      var pct = ours? Number(ours.sharePct)||0 : 100;
      return full*(pct/100);
    }
    return full;
  }
  function consortiumMemberName(m){
    if(m.partnerId===null || m.partnerId===undefined) return '레몬헬스케어(우리 회사)';

  function computeProjectCost(p){
    var labor=0, overheadRate=0;
    (p.assignments||[]).forEach(function(a){ var c=computeAssignment(a,p); labor+=c.totalLabor; overheadRate+=c.sga; });
    var outsourcing=0;
    (p.outsourcingCosts||[]).forEach(function(o){ outsourcing+=numOr0(o.amount); });
    var indirectItemized=0;
    (p.indirectCosts||[]).forEach(function(o){ indirectItemized+=numOr0(o.amount); });
    var proposalCost = numOr0(p.proposalCost);
    var direct = labor+outsourcing;
    var indirect = overheadRate+indirectItemized;
    var total = direct+indirect+proposalCost;
    var revenue = projectRevenue(p);
    var margin = revenue - total;
    var marginRate = (revenue? margin/revenue*100 : null);
    return {labor:labor, overheadRate:overheadRate, indirectItemized:indirectItemized, indirect:indirect, outsourcing:outsourcing, proposalCost:proposalCost, direct:direct, total:total, revenue:revenue, margin:margin, marginRate:marginRate};
  }

  // ---- 진행기준/수주기준 손익, 수주잔고 ----
  function projectProgressRatio(p, asOfDate){
    if(!p.startDate || !p.endDate) return p.startDate && new Date(p.startDate)<=asOfDate ? 1 : 0;
    var start=new Date(p.startDate), end=new Date(p.endDate);
    if(asOfDate<=start) return 0;
    if(asOfDate>=end) return 1;
    return (asOfDate-start)/(end-start);
  }
  function projectAwardDate(p){
    var pr = p.proposalId? proposal(p.proposalId) : null;
    var d = pr && pr.milestones && pr.milestones.resultAnnounce.date;
    return d || p.startDate || null;
  }
  // 진행기준(percentage-of-completion): 선택 기간 [rangeStart, rangeEnd] 동안 인식되는 매출·원가·이익
  function progressBasisPnl(rangeStart, rangeEnd){
    var today=new Date(); today.setHours(0,0,0,0);
    var capEnd = rangeEnd>today? today : rangeEnd;
    var rows = S.projects.map(function(p){
      var cost = computeProjectCost(p);
      var ratioAtStart = p.startDate? projectProgressRatio(p, new Date(rangeStart.getTime()-86400000)) : 0;
      var ratioAtEnd = p.startDate? projectProgressRatio(p, capEnd) : 0;
      var periodRatio = Math.max(0, ratioAtEnd-ratioAtStart);
      var revenue = projectRevenue(p)*periodRatio;
      var costRecognized = cost.total*periodRatio;
      return {p:p, cost:cost, ratio:periodRatio, cumulativeRatio:ratioAtEnd, revenue:revenue, costRecognized:costRecognized, margin:revenue-costRecognized};
    });
    var totals = rows.reduce(function(a,r){ a.revenue+=r.revenue; a.cost+=r.costRecognized; a.margin+=r.margin; return a; }, {revenue:0,cost:0,margin:0});
    totals.marginRate = totals.revenue? totals.margin/totals.revenue*100 : null;
    return {rows:rows, totals:totals};
  }
  // 수주기준(booking basis): 선택 기간에 "수주(결과발표)"된 사업의 전체 계약금액·전체 예상원가를 그 시점에 전액 인식
  function bookingBasisPnl(rangeStart, rangeEnd){
    var rows = S.projects.map(function(p){
      var awardDate = projectAwardDate(p);
      return {p:p, awardDate:awardDate};
    }).filter(function(r){
      if(!r.awardDate) return false;
      var d = new Date(r.awardDate);
      return d>=rangeStart && d<=rangeEnd;
    }).map(function(r){
      var cost = computeProjectCost(r.p);
      var revenue = projectRevenue(r.p);
      return {p:r.p, awardDate:r.awardDate, cost:cost, revenue:revenue, margin:revenue-cost.total};
    });
    var totals = rows.reduce(function(a,r){ a.revenue+=r.revenue; a.cost+=r.cost.total; a.margin+=r.margin; return a; }, {revenue:0,cost:0,margin:0});
    totals.marginRate = totals.revenue? totals.margin/totals.revenue*100 : null;
    return {rows:rows, totals:totals};
  }
  // 수주잔고(매출잔고) = 계약금액 - 오늘까지 진행기준으로 인식된 누적매출, 전체 프로젝트 합산(오늘 시점 스냅샷)
  function backlogSummary(){
    var today=new Date(); today.setHours(0,0,0,0);
    var rows = S.projects.map(function(p){
      var ratio = p.startDate? projectProgressRatio(p, today) : 0;
      var rev = projectRevenue(p);
      var recognized = rev*ratio;
      var backlog = rev-recognized;
      return {p:p, ratio:ratio, recognized:recognized, backlog:backlog};
    }).filter(function(r){ return r.backlog>0.5; });
    var total = rows.reduce(function(a,r){ return a+r.backlog; }, 0);
    return {rows:rows, total:total};
  }

  function partnerAgg(kind){
    var map={};
    S.projects.forEach(function(p){
      (p.outsourcingCosts||[]).forEach(function(o){
        if(o.type!==kind) return;
        if(!map[o.refId]) map[o.refId]={total:0, projects:{}};
        map[o.refId].total += numOr0(o.amount);
        map[o.refId].projects[p.id]=true;
      });
    });
    return map;
  }

  function billableEmployees(){ return S.employees.filter(function(e){ return e.active && !e.alwaysNonBillable; }); }

  // rangeSpec: null(기본 롤링윈도) | {year:Y} | {start:Date,end:Date}
  function resolveMtxWindow(rangeSpec){
    if(rangeSpec && rangeSpec.start && rangeSpec.end){
      return {start:new Date(rangeSpec.start), end:new Date(rangeSpec.end)};
    }
    if(rangeSpec && rangeSpec.year){
      return {start:new Date(rangeSpec.year,0,1), end:new Date(rangeSpec.year,11,1)};
    }
    var today=new Date();
    return {start:new Date(today.getFullYear(),today.getMonth()-6,1), end:new Date(today.getFullYear(),today.getMonth()+12,1)};
  }
  function buildMonthlyMatrix(rangeSpec){
    var map={};
    function ensure(k){ if(!map[k]) map[k]={labor:0,outsourcing:0,employees:{}}; return map[k]; }
    S.projects.forEach(function(p){
      if(p.startDate && p.endDate){
        var months = enumerateMonths(p.startDate,p.endDate);
        (p.assignments||[]).forEach(function(a){
          var emp=employee(a.employeeId); if(!emp) return;
          var monthlyLabor = emp.unitPrice*(numOr0(a.ratio)/100);
          months.forEach(function(mk){ var bucket=ensure(mk); bucket.labor += monthlyLabor; bucket.employees[emp.id]=true; });
        });
      }
      (p.outsourcingCosts||[]).forEach(function(o){ if(!o.date) return; ensure(monthKeyOf(o.date)).outsourcing += numOr0(o.amount); });
    });
    var win = resolveMtxWindow(rangeSpec);
    var keys = enumerateMonths(win.start, win.end);
    var billable = billableEmployees();
    keys.forEach(function(k){
      var m = ensure(k);
      var assignedIds = Object.keys(m.employees);
      var billableAssigned = billable.filter(function(e){ return assignedIds.indexOf(e.id)!==-1; });
      var idle = billable.filter(function(e){ return assignedIds.indexOf(e.id)===-1; });
      m.assignedCount = billableAssigned.length;
      m.idleList = idle;
      m.utilization = billable.length? billableAssigned.length/billable.length*100 : null;
    });
    return {keys:keys, map:map, totalBillable:billable.length};
  }

  function availableProjectYears(){
    var years={};
    S.projects.forEach(function(p){
      if(p.startDate) years[new Date(p.startDate).getFullYear()]=true;
      if(p.endDate) years[new Date(p.endDate).getFullYear()]=true;
    });
    years[new Date().getFullYear()]=true;
    return Object.keys(years).map(Number).sort();
  }

  function buildMonthlyRevenueMatrix(rangeSpec){
    var win = resolveMtxWindow(rangeSpec);
    var months = enumerateMonths(win.start, win.end);
    var map={};
    months.forEach(function(mk){ map[mk]={revenue:0, booking:0}; });
    var todayCap = new Date(); todayCap.setHours(0,0,0,0);
    S.projects.forEach(function(p){
      var rev = projectRevenue(p);
      if(p.startDate && p.endDate){
        months.forEach(function(mk){
          var mStart = new Date(mk+'-01');
          var mEnd = new Date(mStart.getFullYear(), mStart.getMonth()+1, 0);
          var capEnd = mEnd>todayCap? todayCap : mEnd;
          if(capEnd<mStart) return;
          var ratioStart = projectProgressRatio(p, new Date(mStart.getTime()-86400000));
          var ratioEnd = projectProgressRatio(p, capEnd);
          var delta = Math.max(0, ratioEnd-ratioStart);
          if(delta>0) map[mk].revenue += rev*delta;
        });
      }
      var awardDate = projectAwardDate(p);
      if(awardDate){
        var mk2 = monthKeyOf(awardDate);
        if(map[mk2]) map[mk2].booking += rev;
      }
    });
    return {keys:months, map:map};
  }

  // 월말 기준 수주잔고 추이 — 각 월말 시점의 진행률로 잔여 매출(수주잔고)을 스냅샷
  function buildMonthlyBacklogMatrix(monthKeys){
    return monthKeys.map(function(mk){
      var mStart = new Date(mk+'-01');
      var mEnd = new Date(mStart.getFullYear(), mStart.getMonth()+1, 0);
      var total=0;
      S.projects.forEach(function(p){
        var ratio = p.startDate? projectProgressRatio(p, mEnd) : 0;
        var rev = projectRevenue(p);
        var backlog = rev*(1-ratio);
        if(backlog>0.5) total+=backlog;
      });
      return {key:mk, total:total};
    });
  }

  function donutChart(segments, size, revenue){
    var total = segments.reduce(function(a,s){return a+Math.max(0,s.value);},0);
    var r = size/2-13, cx=size/2, cy=size/2, strokeW=22, circ=2*Math.PI*r, gap=2, offset=0;
    var arcs = segments.filter(function(s){return s.value>0;}).map(function(s){
      var frac = total? s.value/total : 0;
      var len = Math.max(0, frac*circ-gap);
      var dashoffset=-offset; offset+=frac*circ;
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+strokeW+'" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+dashoffset+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(s.label)+' '+won(s.value)+'</title></circle>';
    }).join('');
    var compactCost = compactWon(total);
    var revText='';
    if(revenue!=null){
      revText = '<text x="'+cx+'" y="'+(cy-15)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-weight="700">총매출</text>'+
        '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="13" fill="var(--teal-ink,var(--teal))" font-weight="800">'+compactWon(revenue)+'</text>';
    }
    var costY1 = revenue!=null? cy+12 : cy-4, costY2 = revenue!=null? cy+25 : cy+15;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="원가·매출 구성 비율">'+arcs+
      revText+
      '<text x="'+cx+'" y="'+costY1+'" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-weight="700">총원가</text>'+
      '<text x="'+cx+'" y="'+costY2+'" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="800">'+compactCost+'</text></svg>';
  }
  function compactWon(n){
    n = Number(n)||0;
    return n>=100000000? (n/100000000).toFixed(1)+'억' : n>=10000? Math.round(n/10000)+'만' : Math.round(n)+'';
  }
  function costRevenueBreakdown(projects){
    var bd={labor:0,outsourcing:0,indirect:0,proposalCost:0,revenue:0};
    projects.forEach(function(p){
      var c = computeProjectCost(p);
      bd.labor+=c.labor; bd.outsourcing+=c.outsourcing; bd.indirect+=c.indirect; bd.proposalCost+=c.proposalCost; bd.revenue+=c.revenue;
    });
    return bd;
  }
  function computeDonutForScope(scope){
    if(scope==='active'){
      return costRevenueBreakdown(S.projects.filter(function(p){ return projectStatus(p).label==='진행중'; }));
    }
    if(scope==='ytd'){
      var yy=new Date().getFullYear();
      var pnl = progressBasisPnl(new Date(yy,0,1), new Date(yy,11,31));
      var bd={labor:0,outsourcing:0,indirect:0,proposalCost:0,revenue:0};
      pnl.rows.forEach(function(r){
        bd.labor+=r.cost.labor*r.ratio; bd.outsourcing+=r.cost.outsourcing*r.ratio;
        bd.indirect+=r.cost.indirect*r.ratio; bd.proposalCost+=r.cost.proposalCost*r.ratio;
        bd.revenue+=r.revenue;
      });
      return bd;
    }
    return costRevenueBreakdown(S.projects); // 'all'
  }
  function miniBarChart(keys, seriesA, seriesB, labelA, labelB, colorA, colorB){
    var w = Math.max(360, keys.length*46), h=170, padL=8, padR=8, padT=10, padB=22;
    var plotW = w-padL-padR, plotH = h-padT-padB;
    var maxVal = Math.max(1, seriesA.concat(seriesB).reduce(function(a,v){return Math.max(a,Math.abs(v));},0));
    var n = Math.max(1,keys.length);
    var groupW = plotW/n;
    var barW = Math.max(3, Math.min(16, groupW/2-3));
    var bars = keys.map(function(k,i){
      var x0 = padL+i*groupW;
      var vA = seriesA[i]||0, vB = seriesB[i]||0;
      var hA = maxVal? (vA/maxVal*plotH) : 0, hB = maxVal? (vB/maxVal*plotH) : 0;
      var xA = x0+groupW/2-barW-1.5, xB = x0+groupW/2+1.5;
      var yA = padT+plotH-hA, yB = padT+plotH-hB;
      return '<rect x="'+xA+'" y="'+yA+'" width="'+barW+'" height="'+Math.max(0,hA)+'" rx="2" fill="'+colorA+'"><title>'+esc(k)+' '+labelA+': '+Math.round(vA).toLocaleString('ko-KR')+'</title></rect>'+
        '<rect x="'+xB+'" y="'+yB+'" width="'+barW+'" height="'+Math.max(0,hB)+'" rx="2" fill="'+colorB+'"><title>'+esc(k)+' '+labelB+': '+Math.round(vB).toLocaleString('ko-KR')+'</title></rect>'+
        '<text x="'+(x0+groupW/2)+'" y="'+(h-7)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+esc(k.slice(2))+'</text>';
    }).join('');
    return '<div class="twrap"><svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="min-width:'+w+'px" role="img" aria-label="월별 막대그래프">'+
      '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(w-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--line)" stroke-width="1"/>'+
      bars+'</svg></div>'+
      '<div class="donut-legend" style="flex-direction:row;gap:16px;margin-top:6px">'+
        '<div class="row"><span class="sw" style="background:'+colorA+'"></span>'+esc(labelA)+'</div>'+
        '<div class="row"><span class="sw" style="background:'+colorB+'"></span>'+esc(labelB)+'</div>'+
      '</div>';
  }

  var toastTimer=null;
  function showToast(msg, kind){
    var host = document.getElementById('toastHost');
    if(!host) return;
    var el = document.createElement('div');
    el.className = 'toast'+(kind==='warn'?' warn':'');
    el.textContent = msg;
    host.appendChild(el);
    window.setTimeout(function(){ el.classList.add('show'); }, 10);
    window.setTimeout(function(){
      el.classList.remove('show');
      window.setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, 2600);
  }

  // ---- 엑셀 다운로드/업로드 공통 유틸 (SheetJS 필요 — claude.ai 아티팩트 미리보기에서는 CSP로 로드되지 않음) ----
  function xlsxAvailable(){ return typeof XLSX !== 'undefined'; }
  function xlsxWarnUnavailable(){
    showToast('엑셀 기능은 이 아티팩트 미리보기에서는 동작하지 않습니다. GitHub Pages(kimhongshik.github.io/vrb)에서 이용해주세요.', 'warn');
  }
  function exportSheet(filename, sheetName, headers, rows){
    if(!xlsxAvailable()){ xlsxWarnUnavailable(); return; }
    try{
      var aoa = [headers].concat(rows);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
    }catch(err){
      showToast('엑셀 파일 생성 중 오류: '+(err&&err.message?err.message:err), 'warn');
    }
  }
  // 수식이 포함된 시트를 만들 때 쓰는 저수준 유틸: aoa로 뼈대를 만들고, 특정 셀을 수식/날짜 형식으로 덮어씁니다.
  function writeFormulaSheet(filename, sheetName, aoa, cellFn){
    if(!xlsxAvailable()){ xlsxWarnUnavailable(); return; }
    try{
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      if(cellFn) cellFn(ws);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
    }catch(err){
      showToast('엑셀 파일 생성 중 오류: '+(err&&err.message?err.message:err), 'warn');
    }
  }
  function setFormula(ws, ref, formula, value){
    ws[ref] = {t:'n', f:formula, v:(value==null?0:value)};
  }
  function setDateFmt(ws, ref){
    if(ws[ref]) ws[ref].z = 'yyyy-mm-dd';
  }
  // callback(dataRows) — 헤더 행을 제외한 나머지 행(각 행은 셀 값 배열)만 전달
  function importSheetFile(fileInput, callback){
    if(!xlsxAvailable()){ xlsxWarnUnavailable(); return; }
    var file = fileInput && fileInput.files && fileInput.files[0];
    if(!file){ showToast('업로드할 엑셀 파일(.xlsx)을 선택해주세요.', 'warn'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
        rows.shift(); // 헤더 행 제거
        rows = rows.filter(function(r){ return r.some(function(c){ return String(c||'').trim()!==''; }); });
        callback(rows);
      }catch(err){
        showToast('엑셀 파일을 읽는 중 오류: '+(err&&err.message?err.message:err), 'warn');
      }
    };
    reader.onerror = function(){ showToast('파일을 읽는 중 오류가 발생했습니다.', 'warn'); };
    reader.readAsArrayBuffer(file);
  }

  function resolveDashboardMtxRangeSpec(mode, year, custStart, custEnd){
    if(mode==='custom' && custStart && custEnd) return {start:custStart, end:custEnd};
    if(mode==='year' && year) return {year:year};
    return null;
  }
  function mtxRangeControls(target, mode, year, custStart, custEnd){
    var yearOpts = availableProjectYears().map(function(y){return '<option value="'+y+'"'+(year===y?' selected':'')+'>'+y+'년</option>';}).join('');
    return '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+
      '<span class="seg" style="display:inline-flex">'+
        '<button class="'+(mode==='rolling'?'active':'')+'" type="button" data-action="set-mtx-mode" data-target="'+target+'" data-mode="rolling">기본(최근~향후)</button>'+
        '<button class="'+(mode==='year'?'active':'')+'" type="button" data-action="set-mtx-mode" data-target="'+target+'" data-mode="year">연도선택</button>'+
        '<button class="'+(mode==='custom'?'active':'')+'" type="button" data-action="set-mtx-mode" data-target="'+target+'" data-mode="custom">날짜 지정</button>'+
      '</span>'+
      (mode==='year'? '<select data-action-select="mtx-year" data-target="'+target+'" style="font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)"><option value="">연도 선택</option>'+yearOpts+'</select>' : '')+
      (mode==='custom'? '<input type="date" data-mtx-range="'+target+'" data-bound="start" value="'+esc(custStart||'')+'"><span class="label">~</span><input type="date" data-mtx-range="'+target+'" data-bound="end" value="'+esc(custEnd||'')+'">' : '')+
    '</div>';
  }
  function renderDashboard(){
    S.ui.dashboardPeriodMode = S.ui.dashboardPeriodMode || 'ytd';
    S.ui.dashboardBasis = S.ui.dashboardBasis || 'progress';
    var range;
    if(S.ui.dashboardPeriodMode==='custom' && S.ui.dashboardPeriodStart && S.ui.dashboardPeriodEnd){
      range = {start:new Date(S.ui.dashboardPeriodStart), end:new Date(S.ui.dashboardPeriodEnd)};
    } else {
      var yy=new Date().getFullYear();
      range = {start:new Date(yy,0,1), end:new Date(yy,11,31)};
    }
    var basis = S.ui.dashboardBasis;
    var pnl = basis==='progress'? progressBasisPnl(range.start,range.end) : bookingBasisPnl(range.start,range.end);
    var bd = {labor:0,outsourcing:0,indirect:0,proposalCost:0};
    pnl.rows.forEach(function(r){
      var mult = basis==='progress'? r.ratio : 1;
      bd.labor += r.cost.labor*mult; bd.outsourcing += r.cost.outsourcing*mult;
      bd.indirect += r.cost.indirect*mult; bd.proposalCost += r.cost.proposalCost*mult;
    });
    var bdTotal = bd.labor+bd.outsourcing+bd.indirect+bd.proposalCost;
    var periodLabel = S.ui.dashboardPeriodMode==='custom'
      ? (S.ui.dashboardPeriodStart||'?')+' ~ '+(S.ui.dashboardPeriodEnd||'?')
      : range.start.getFullYear()+'년(당해년도)';

    var donutSegs = [
      {label:'인건비', value:bd.labor, color:'var(--teal)'},
      {label:'외주비', value:bd.outsourcing, color:'var(--info)'},
      {label:'간접비', value:bd.indirect, color:'var(--warn)'},
      {label:'제안비용', value:bd.proposalCost, color:'var(--violet)'}
    ];
    var legendHtml = donutSegs.map(function(s){
      var pct = bdTotal>0? Math.round(s.value/bdTotal*100) : 0;
      return '<div class="row"><span class="sw" style="background:'+s.color+'"></span>'+s.label+' <span class="sub">('+pct+'%)</span><b>'+won(s.value)+'</b></div>';
    }).join('');

    var basisRows = pnl.rows.filter(function(r){ return basis==='progress'? r.ratio>0 : true; }).map(function(r){
      var c = client(r.p.clientId);
      var period = esc(r.p.startDate||'-')+' ~ '+esc(r.p.endDate||'-');
      return basis==='progress'
        ? '<tr><td>'+esc(r.p.code)+'</td><td>'+esc(r.p.name)+'</td><td class="num">'+period+'</td><td class="right num">'+(r.cumulativeRatio*100).toFixed(0)+'%</td><td class="right num">'+won(r.revenue)+'</td><td class="right num">'+won(r.costRecognized)+'</td><td class="right num" style="color:'+(r.margin>=0?'var(--success)':'var(--crit)')+'">'+won(r.margin)+'</td></tr>'
        : '<tr><td>'+esc(r.p.code)+'</td><td>'+esc(r.p.name)+'</td><td class="num">'+period+'</td><td class="num">'+esc(r.awardDate)+'</td><td class="right num">'+won(r.revenue)+'</td><td class="right num">'+won(r.cost.total)+'</td><td class="right num" style="color:'+(r.margin>=0?'var(--success)':'var(--crit)')+'">'+won(r.margin)+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="7">해당 기간에 해당하는 프로젝트가 없습니다.</td></tr>';
    var basisHead = basis==='progress'
      ? '<th>코드</th><th>사업명</th><th>사업기간</th><th class="right">누적진행률</th><th class="right">기간 인식매출</th><th class="right">기간 매칭원가</th><th class="right">기간 이익</th>'
      : '<th>코드</th><th>사업명</th><th>사업기간</th><th>수주일</th><th class="right">계약금액</th><th class="right">총원가</th><th class="right">이익</th>';

    var backlog = backlogSummary();
    var backlogRows = backlog.rows.map(function(r){
      return '<tr><td>'+esc(r.p.code)+'</td><td>'+esc(r.p.name)+'</td><td class="right num">'+(r.ratio*100).toFixed(0)+'%</td><td class="right num">'+won(r.p.contractAmount)+'</td><td class="right num">'+won(r.recognized)+'</td><td class="right num" style="font-weight:700;color:var(--violet)">'+won(r.backlog)+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="6">잔여 수주잔고가 없습니다.</td></tr>';

    var scopeDefs = [
      {key:'all', label:'전체기간'},
      {key:'ytd', label:'당해년도('+new Date().getFullYear()+')'},
      {key:'active', label:'진행중 프로젝트'}
    ];
    var scopePanels = scopeDefs.map(function(sd){
      var bd2 = computeDonutForScope(sd.key);
      var segs2 = [
        {label:'인건비', value:bd2.labor, color:'var(--teal)'},
        {label:'외주비', value:bd2.outsourcing, color:'var(--info)'},
        {label:'간접비', value:bd2.indirect, color:'var(--warn)'},
        {label:'제안비용', value:bd2.proposalCost, color:'var(--violet)'}
      ];
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><h3 style="font-size:13px;margin:0">'+sd.label+'</h3>'+donutChart(segs2,150,bd2.revenue)+'</div>';
    }).join('');

    S.ui.revMtxMode = S.ui.revMtxMode || 'rolling';
    S.ui.laborMtxMode = S.ui.laborMtxMode || 'rolling';
    var revRangeSpec = resolveDashboardMtxRangeSpec(S.ui.revMtxMode, S.ui.revMtxYear, S.ui.revMtxCustomStart, S.ui.revMtxCustomEnd);
    var laborRangeSpec = resolveDashboardMtxRangeSpec(S.ui.laborMtxMode, S.ui.laborMtxYear, S.ui.laborMtxCustomStart, S.ui.laborMtxCustomEnd);

    var mtx = buildMonthlyMatrix(laborRangeSpec);

    var bookRow = revMtx.keys.map(function(k){return '<td class="center num">'+Math.round(revMtx.map[k].booking/1000000)+'M</td>';}).join('');
    var revBarChart = revMtx.keys.length? miniBarChart(revMtx.keys, revMtx.keys.map(function(k){return revMtx.map[k].revenue;}), revMtx.keys.map(function(k){return revMtx.map[k].booking;}), '매출', '수주', 'var(--teal)', 'var(--info)') : '';

    var mtxHead = mtx.keys.map(function(k){return '<th class="center">'+k.slice(2)+'</th>';}).join('');
    var laborRow = mtx.keys.map(function(k){return '<td class="center num">'+Math.round(mtx.map[k].labor/1000000)+'M</td>';}).join('');
    var outRow = mtx.keys.map(function(k){return '<td class="center num">'+Math.round(mtx.map[k].outsourcing/1000000)+'M</td>';}).join('');
    var sumRow = mtx.keys.map(function(k){return '<td class="center num" style="font-weight:700">'+Math.round((mtx.map[k].labor+mtx.map[k].outsourcing)/1000000)+'M</td>';}).join('');
    var totalHeadRow = mtx.keys.map(function(){return '<td class="center num">'+mtx.totalBillable+'명</td>';}).join('');
    var assignedRow = mtx.keys.map(function(k){return '<td class="center num" style="color:var(--success)">'+mtx.map[k].assignedCount+'명</td>';}).join('');
    var idleCountRow = mtx.keys.map(function(k){return '<td class="center num" style="color:var(--warn)">'+mtx.map[k].idleList.length+'명</td>';}).join('');
    var utilRow = mtx.keys.map(function(k){
      var u=mtx.map[k].utilization;
      var color = u==null? 'var(--muted)' : (u>=85? 'var(--crit)' : u>=60? 'var(--success)' : 'var(--warn)');
      return '<td class="center num" style="color:'+color+';font-weight:700">'+(u==null?'-':u.toFixed(0)+'%')+'</td>';
    }).join('');
    var idleRow = mtx.keys.map(function(k){
      var idleN = mtx.map[k].idleList.length;
      var active = S.ui.dashboardIdleMonth===k;
      return '<td class="center num"><button class="linkbtn" style="'+(active?'color:var(--crit)':'')+'" data-action="toggle-idle-month" data-month="'+k+'">'+idleN+'명</button></td>';
    }).join('');
    var laborBarChart = mtx.keys.length? miniBarChart(mtx.keys, mtx.keys.map(function(k){return mtx.map[k].labor;}), mtx.keys.map(function(k){return mtx.map[k].outsourcing;}), '인건비', '외주비', 'var(--teal)', 'var(--info)') : '';
    var idlePanel='';
    if(S.ui.dashboardIdleMonth && mtx.map[S.ui.dashboardIdleMonth]){
      var idleList = mtx.map[S.ui.dashboardIdleMonth].idleList;
      idlePanel = '<div class="panel" style="border-color:var(--crit)"><div class="panelhead"><h2>'+S.ui.dashboardIdleMonth+' 비가동 인력 ('+idleList.length+'명)</h2>'+
        '<button class="linkbtn" data-action="toggle-idle-month" data-month="'+S.ui.dashboardIdleMonth+'">닫기</button></div>'+
        (idleList.length? '<p class="sub" style="margin-bottom:0">'+idleList.map(function(e){return esc(e.name)+'('+esc(e.dept)+'·'+esc(e.position)+')';}).join(', ')+'</p>' : '<p class="sub" style="margin-bottom:0">해당 월에는 전원 투입 중입니다.</p>')+
        '</div>';
    }

    var backlogTrend = buildMonthlyBacklogMatrix(revMtx.keys);
    var backlogTrendRow = backlogTrend.map(function(b){return '<td class="center num">'+Math.round(b.total/1000000)+'M</td>';}).join('');

    var allRows = S.projects.map(function(p){ return {p:p, cost:computeProjectCost(p), st:projectStatus(p), c:client(p.clientId)}; });
    var projRows = allRows.map(function(r){
      return '<tr><td>'+esc(r.p.code)+'</td><td>'+esc(r.p.name)+'</td><td>'+esc(r.c?r.c.name:'-')+'</td><td>'+statusPill(r.st)+'</td>'+

        '<td class="right num">'+won(r.cost.labor)+'</td>'+
        '<td class="right num">'+won(r.cost.outsourcing)+'</td>'+

        '<td class="right num" style="color:'+(r.cost.margin>=0?'var(--success)':'var(--crit)')+'">'+won(r.cost.margin)+'</td>'+
        '<td class="right num">'+(r.cost.marginRate==null?'-':r.cost.marginRate.toFixed(1)+'%')+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="11">프로젝트가 없습니다.</td></tr>';

      '<div class="panel">'+
        '<div class="periodbar">'+

        '<p class="sub">조회 기간: <b>'+periodLabel+'</b> &middot; '+(basis==='progress'? '진행기준(percentage-of-completion) — 계약금액을 사업기간에 비례 배분해 해당 기간 매출로 인식합니다.' : '수주기준 — 해당 기간에 수주(결과발표)한 사업의 계약금액·원가를 그 시점에 전액 인식합니다.')+'</p>'+

      '<div class="panel"><h2>기간별 원가 · 매출 개요</h2><p class="sub">전체기간(누적 전체), 당해년도(진행기준으로 올해 인식된 분), 진행중 프로젝트만의 원가 구성과 총매출·총원가를 함께 보여줍니다.</p>'+

      '<div class="panel"><h2>전사 손익 요약</h2>'+
      '<div class="donutwrap" style="margin-bottom:14px">'+

  function externalHistory(kind, refId){
    var rows=[];
    S.projects.forEach(function(p){
      var sum = (p.outsourcingCosts||[]).filter(function(o){return o.type===kind && o.refId===refId;}).reduce(function(a,o){return a+numOr0(o.amount);},0);

  }

  function partnerContracts(partnerId){
    var rows=[];

  // ---- WBS(작업분류체계) ----
  function daysBetweenInclusive(startStr, endStr){
    if(!startStr || !endStr) return 0;
    var s = new Date(startStr), e = new Date(endStr);
    var diff = Math.round((e-s)/86400000)+1;
    return Math.max(0, diff);
  }
  // 기준일이 작업기간 중 어디쯤인지로 "계획대로라면 지금 몇 % 진행되어 있어야 하는가"를 산출
  function wbsPlannedRate(task, reportDate){
    if(!task.startDate || !task.endDate) return 0;
    var s = new Date(task.startDate), e = new Date(task.endDate), r = new Date(reportDate);
    if(e<=s) return 0;
    if(r<=s) return 0;
    if(r>=e) return 100;
    return (r-s)/(e-s)*100;
  }
  function wbsDomainGroups(p){
    var order=[], map={};
    (p.wbs.tasks||[]).forEach(function(t){
      if(!map[t.domain]){ map[t.domain]={name:t.domain, tasks:[]}; order.push(t.domain); }
      map[t.domain].tasks.push(t);
    });
    return order.map(function(k){ return map[k]; });
  }
  // 가중치를 반영한 계획율/실적율/공정율(실적÷계획) 가중평균
  function wbsRollup(tasks, reportDate){
    var planSum=0, actSum=0, wSum=0;
    tasks.forEach(function(t){
      var w = numOr0(t.weight);
      planSum += wbsPlannedRate(t, reportDate)*w;
      actSum += numOr0(t.actualRate)*w;
      wSum += w;
    });
    var plan = wSum? planSum/wSum : 0;
    var act = wSum? actSum/wSum : 0;
    return {plan:plan, act:act, progress: plan? (act/plan*100) : 0};
  }

  // RFP 자동분석 API가 반환한 구조화 결과를 제안 데이터에 반영
  function applyRfpAnalysisResult(pp, result){
    if(!result) return;
    if(result.projectName) pp.name = result.projectName;
    if(result.estimatedBudget!=null) pp.presales.estimatedBudget = Number(result.estimatedBudget)||null;
    if(result.requirementsSummary) pp.presales.overview = result.requirementsSummary;
    if(result.bizTypeGuess && BIZ_TYPE_LABEL[result.bizTypeGuess]) pp.bizType = result.bizTypeGuess;
    var milestoneMap = {preAnnounceDate:'preAnnounce', announceDate:'rfp', proposalDeadline:'proposalDeadline', proposalPresentationDate:'proposalPresentation', resultAnnounceDate:'resultAnnounce'};
    Object.keys(milestoneMap).forEach(function(k){
      if(result[k]) pp.milestones[milestoneMap[k]].date = result[k];
    });
    pp.rfpAnalysis = {requiredAttachments: result.requiredAttachments||[], analyzedAt: new Date().toISOString().slice(0,10)};
  }

  var SALES_STAGES = ['리드','접촉','미팅','제안준비','제안중','수주','실주'];
  var SALES_STAGE_CLS = {'리드':'draft','접촉':'info','미팅':'info','제안준비':'warn','제안중':'warn','수주':'success','실주':'crit'};

  function salesClientName(sa){
    var c = sa.clientId? client(sa.clientId) : null;
    return c? c.name : (sa.clientName||'-');
  }
  function meetingWithLabel(mw){
    if(!mw) return '';
    var out='';
    if(mw.type==='partner'){ var pt=partner(mw.partnerId); out += ' <span class="pill info">협력업체: '+esc(pt?pt.name:'-')+'</span>'; }
    else if(mw.type==='other') out += ' <span class="pill draft">기타: '+esc(mw.otherName||'-')+'</span>';
    if(mw.contactName) out += ' <span class="pill">담당자: '+esc(mw.contactName)+(mw.contactPhone?' · '+esc(mw.contactPhone):'')+'</span>';
    return out;
  }

  function renderSales(){
    var salesReps = S.employees.filter(function(e){ return e.jobType==='영업' || (S.salesActivities||[]).some(function(s){return s.salesEmployeeId===e.id;}); });
    var filterClient = S.ui.salesFilterClient || '';
    var filterRep = S.ui.salesFilterRep || '';
    var filterStage = S.ui.salesFilterStage || '';
    var pipelineList = S.salesActivities.filter(function(sa){
      if(filterClient && sa.clientId!==filterClient) return false;
      if(filterRep && sa.salesEmployeeId!==filterRep) return false;
      if(filterStage && sa.stage!==filterStage) return false;
      return true;
    });
    var rows = pipelineList.map(function(sa){
      var rep = employee(sa.salesEmployeeId);
      var updates = (sa.updates||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
      var latest = updates[0];
      return '<tr data-action="toggle-sales-detail" data-id="'+sa.id+'" style="cursor:pointer">'+
        '<td>'+esc(sa.opportunityName)+'</td><td>'+esc(salesClientName(sa))+'</td><td>'+esc(rep?rep.name:'-')+'</td>'+
        '<td><span class="pill '+(SALES_STAGE_CLS[sa.stage]||'draft')+'">'+esc(sa.stage)+'</span></td>'+
        '<td class="right num">'+won(sa.expectedAmount)+'</td><td class="num">'+esc(sa.expectedDate||'-')+'</td>'+
        '<td>'+(latest? esc(latest.date)+' '+esc(latest.note) : '-')+'</td></tr>'+
        (S.ui.openSalesId===sa.id? '<tr><td colspan="7" style="background:var(--paper)">'+
          '<div style="padding:10px 4px">'+
          '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">'+
          (updates.length? updates.map(function(u){return '<div class="ms-row ms-2col" style="padding:6px 0"><span class="lbl">'+esc(u.date)+'</span><span>'+esc(u.note)+meetingWithLabel(u.meetingWith)+'</span></div>';}).join('') : '<p class="sub">업데이트 이력이 없습니다.</p>')+

            '<div class="field" style="grid-column:span 2"><label>업데이트 내용</label><input name="note" required placeholder="예: 2차 미팅 완료, 예산 확정 대기"></div>'+
            '<div class="field"><label>미팅 대상</label><select name="meetingType" data-meeting-type-select><option value="">선택 안 함</option><option value="partner">협력업체</option><option value="other">기타(미등록 업체)</option></select></div>'+
            '<div class="field" data-meeting-partner-field style="display:none"><label>협력업체</label><select name="meetingPartnerId"><option value="">선택</option>'+S.partners.map(function(x){return opt(x.id,x.name+' · '+x.field);}).join('')+'</select></div>'+
            '<div class="field" data-meeting-other-field style="display:none"><label>기타 회사명</label><input name="meetingOtherName" placeholder="아직 등록되지 않은 업체명"></div>'+
            '<div class="field"><label>미팅 담당자 이름</label><input name="contactName" placeholder="예: 홍길동 팀장"></div>'+
            '<div class="field"><label>담당자 연락처</label><input name="contactPhone" placeholder="예: 010-1234-5678"></div>'+

        (S.ui.showSalesQuickClient? (
          '<div class="refbox" style="margin-bottom:12px"><h3>신규 고객사 등록</h3>'+
          '<form data-form="salesQuickClientForm" class="grid cols-3">'+

          '</form></div>'
        ) : '')+
        '<form data-form="salesForm" class="grid cols-4">'+
          '<div class="field"><label>영업담당 <span class="req">*</span></label><select name="salesEmployeeId" required><option value="">선택</option>'+S.employees.map(function(e){return opt(e.id,e.name+' · '+e.dept);}).join('')+'</select></div>'+

            '<button class="iconbtn" type="button" data-action="toggle-sales-quick-client" style="white-space:nowrap">+ 고객사 등록</button></div></div>'+
          '<div class="field"><label>진행단계</label><select name="stage">'+SALES_STAGES.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></div>'+

          '<div class="field"><label>예상 시기</label><input type="date" name="expectedDate"></div>'+
          '<div class="btnrow" style="grid-column:1/-1"><button class="btn primary" type="submit">영업건 등록</button></div>'+

      '<div class="panel"><h2>영업 파이프라인</h2><p class="sub">행을 클릭하면 업데이트 이력을 열람·추가할 수 있습니다. 영업사원 '+salesReps.length+'명이 관리 중입니다. 아래에서 고객사·영업담당·단계로 필터링해 볼 수 있습니다.</p>'+
        '<div class="grid cols-4" style="margin-bottom:12px">'+

          '<div class="field"><label>단계 필터</label><select data-action-select="sales-filter-stage"><option value="">전체 단계</option>'+SALES_STAGES.map(function(s){return '<option value="'+s+'"'+(filterStage===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div>'+

  function inWBS(p){
    p.wbs = p.wbs || {reportDate:new Date().toISOString().slice(0,10), tasks:[]};
    var reportDate = p.wbs.reportDate;
    var groups = wbsDomainGroups(p);
    var overall = wbsRollup(p.wbs.tasks||[], reportDate);
    var domainListOpts = groups.map(function(g){ return '<option value="'+esc(g.name)+'">'; }).join('');

    var groupsHtml = groups.map(function(g){
      var roll = wbsRollup(g.tasks, reportDate);
      var rowsHtml = g.tasks.map(function(t){
        var workDays = daysBetweenInclusive(t.startDate, t.endDate);
        var plan = wbsPlannedRate(t, reportDate);
        var act = numOr0(t.actualRate);
        var variance = act-plan;
        var actualDays = Math.round(workDays*act/100);
        return '<tr><td>'+esc(t.activity)+'</td><td>'+esc(t.name)+'</td>'+
          '<td class="num">'+esc(t.startDate||'-')+' ~ '+esc(t.endDate||'-')+'</td>'+
          '<td class="right num">'+workDays+'</td>'+
          '<td class="right num">'+plan.toFixed(1)+'%</td>'+

          '<td class="right num">'+actualDays+'</td>'+
          '<td class="right num">'+t.weight+'%</td>'+

        '<div class="twrap"><table><thead><tr><th>Activity</th><th>Task</th><th>기간</th><th class="right">작업일수</th><th class="right">계획완료율</th><th class="right">실제완료율</th><th class="right">차이</th><th class="right">실적일수</th><th class="right">가중치</th><th>담당</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';

    return '<div class="panel"><h2>WBS(작업분류체계) &middot; 진행현황</h2>'+
      '<p class="sub">Domain · Activity · Task 단위로 일정과 가중치를 등록하면, 기준일 대비 계획 진도율과 실제 진도율을 비교해 공정율(실적÷계획)을 계산합니다. 엑셀로 다운받아 여러 건을 한 번에 채운 뒤 업로드하면 전체가 반영되며, 다운로드한 파일은 그대로 월간보고 제출 자료로 쓸 수 있습니다. 다운로드한 파일의 계획완료율(%)은 실제 엑셀 수식이라 시작일·종료일·기준일(우측 상단 셀)을 고치면 자동으로 재계산됩니다.</p>'+
      '<div class="btnrow" style="margin-bottom:12px">'+
        '<button class="btn ghost" type="button" data-action="export-wbs">엑셀 다운로드</button>'+
        '<input type="file" accept=".xlsx,.xls" data-wbs-file-input>'+
        '<button class="btn ghost" type="button" data-action="import-wbs">엑셀 업로드(전체 교체)</button>'+
      '</div>'+
      '<div class="grid cols-4" style="margin-bottom:14px">'+
        '<div class="field"><label>기준일</label><input type="date" data-wbs-reportdate value="'+esc(reportDate)+'"></div>'+
        '<div class="kpi"><div class="k">전체 계획율</div><div class="v num">'+overall.plan.toFixed(1)+'%</div></div>'+
        '<div class="kpi"><div class="k">전체 실적율</div><div class="v num">'+overall.act.toFixed(1)+'%</div></div>'+
        '<div class="kpi" style="border-color:'+(overall.progress>=80?'var(--success)':overall.progress>=50?'var(--warn)':'var(--crit)')+'"><div class="k">전체 공정율</div><div class="v num" style="color:'+(overall.progress>=80?'var(--success)':overall.progress>=50?'var(--warn)':'var(--crit)')+'">'+overall.progress.toFixed(1)+'%</div></div>'+
      '</div>'+
      '<form data-form="wbsTaskForm" class="grid cols-4">'+
        '<div class="field"><label>Domain <span class="req">*</span></label><input name="domain" required placeholder="예: A. 과제관리" list="wbsDomainList"></div>'+
        '<div class="field"><label>Activity <span class="req">*</span></label><input name="activity" required placeholder="예: 과제 수행 관리"></div>'+
        '<div class="field" style="grid-column:span 2"><label>Task <span class="req">*</span></label><input name="name" required placeholder="예: PMO 주간회의"></div>'+
        '<div class="field"><label>시작일</label><input type="date" name="startDate"></div>'+
        '<div class="field"><label>종료일</label><input type="date" name="endDate"></div>'+
        '<div class="field"><label>가중치(%)</label><input class="num" type="number" step="0.1" name="weight" value="10"></div>'+
        '<div class="field"><label>담당</label><input name="assignee" placeholder="이름 또는 업체명"></div>'+
        '<div class="btnrow" style="grid-column:1/-1"><button class="btn primary" type="submit">WBS 작업 추가</button></div>'+
      '</form>'+
      '<datalist id="wbsDomainList">'+domainListOpts+'</datalist>'+
      groupsHtml+
    '</div>';
  }

  // ==================================================================
  //  PROJECT DETAIL — OUTPUT sub-views (read-only)
  // ==================================================================
  function outSummary(p){

    var isCons = p.consortium && p.consortium.isConsortium;
    return '<div class="panel"><h2>원가 요약</h2><p class="sub">입력 메뉴에서 등록한 인력·외주·간접비·제안비용 데이터를 바탕으로 자동 집계된 결과입니다.</p>'+
      '<div class="costcards">'+
        '<div class="costcard"><div class="k">인건비</div><div class="v num">'+won(cost.labor)+'</div><div class="d">내부 인력 투입 원가</div></div>'+
        '<div class="costcard"><div class="k">외주비</div><div class="v num">'+won(cost.outsourcing)+'</div><div class="d">협력업체+프리랜서</div></div>'+
        '<div class="costcard" style="border-color:var(--teal)"><div class="k">직접비</div><div class="v num" style="color:var(--teal-ink)">'+won(cost.direct)+'</div><div class="d">인건비+외주비</div></div>'+
        '<div class="costcard" style="border-color:var(--info)"><div class="k">간접비</div><div class="v num" style="color:var(--info)">'+won(cost.indirect)+'</div><div class="d">판관비 '+won(cost.overheadRate)+' + 항목 '+won(cost.indirectItemized)+'</div></div>'+
      '</div>'+
      '<div class="costcards">'+
        '<div class="costcard" style="border-color:var(--violet)"><div class="k">제안비용</div><div class="v num" style="color:var(--violet)">'+won(cost.proposalCost)+'</div><div class="d">수주 시 반영된 제안 VRB 비용</div></div>'+
        '<div class="costcard" style="border-color:var(--ink)"><div class="k">총 원가</div><div class="v num">'+won(cost.total)+'</div><div class="d">직접비+간접비+제안비용</div></div>'+
        '<div class="costcard '+(cost.margin>=0?'margin-pos':'margin-neg')+'"><div class="k">예상 마진</div><div class="v num">'+won(cost.margin)+'</div><div class="d">우리 매출&minus;총원가</div></div>'+
        '<div class="costcard '+(cost.margin>=0?'margin-pos':'margin-neg')+'"><div class="k">예상 마진율</div><div class="v num">'+(cost.marginRate==null?'-':cost.marginRate.toFixed(2)+'%')+'</div></div>'+
      '</div>'+
      '<div class="costcards">'+
        '<div class="costcard"><div class="k">계약금액'+(isCons?'(컨소시엄 전체)':'')+'</div><div class="v num">'+won(p.contractAmount)+'</div></div>'+
        '<div class="costcard" style="border-color:var(--teal)"><div class="k">우리 매출</div><div class="v num" style="color:var(--teal-ink)">'+won(cost.revenue)+'</div><div class="d">'+(isCons? '컨소시엄 '+esc(p.consortium.role)+' · 참여사 '+(p.consortium.members||[]).length+'개사' : '단독 수행(지분 100%)')+'</div></div>'+
      '</div></div>';
  }

  function outMatrix(p){
    var months = enumerateMonths(p.startDate,p.endDate);
    if(!months.length){
      return '<div class="panel"><h2>인력투입 현황</h2><p class="sub">시작일/종료일을 입력하면 월별 인력투입 매트릭스가 표시됩니다.</p></div>';
    }
    var head = months.map(function(m){return '<th class="center">'+m.slice(2)+'</th>';}).join('');
    var rows = (p.assignments||[]).map(function(a){
      var emp = employee(a.employeeId); if(!emp) return '';
      var monthlyLabor = emp.unitPrice*(numOr0(a.ratio)/100);
      var cells = months.map(function(){return '<td class="center num">'+(monthlyLabor/1000000).toFixed(1)+'M</td>';}).join('');
      return '<tr><td>'+esc(emp.name)+'</td><td>'+esc(emp.position)+'</td><td class="center"><span class="pill '+(a.role==='PM'?'crit':a.role==='PL'?'info':'draft')+'">'+esc(a.role||'-')+'</span></td><td class="center num">'+a.ratio+'%</td>'+cells+'</tr>';
    }).join('') || '';
    var totalPerMonth = 0;
    (p.assignments||[]).forEach(function(a){ var emp=employee(a.employeeId); if(emp) totalPerMonth += emp.unitPrice*(numOr0(a.ratio)/100); });
    var totalCells = months.map(function(){return '<td class="center num" style="font-weight:700">'+(totalPerMonth/1000000).toFixed(1)+'M</td>';}).join('');

    return '<div class="panel"><h2>인력투입 현황</h2><p class="sub">인력별 역할(PM/PL 등)과 월 인건비(백만원 단위)를 시작일~종료일 전체 구간에 대해 표시합니다.</p>'+
      '<div class="twrap"><table><thead><tr><th>이름</th><th>직급</th><th class="center">역할</th><th class="center">투입비율</th>'+head+'</tr></thead><tbody>'+
      rows+'<tr class="subtotal"><td colspan="4">합계(인건비, 백만원)</td>'+totalCells+'</tr>'+
      '</tbody></table></div></div>';
  }

  function outLedger(p){
    function rows(type){
      return (p.outsourcingCosts||[]).filter(function(o){return o.type===type;}).map(function(o){
        var ref = type==='partner'? partner(o.refId) : freelancer(o.refId);
        return '<tr><td>'+esc(ref?ref.name:'(삭제된 항목)')+'</td><td>'+esc(o.memo||'')+'</td><td class="num">'+esc(o.date||'')+'</td><td class="right num">'+won(o.amount)+'</td></tr>';
      }).join('') || '<tr class="empty-row"><td colspan="4">등록된 내역이 없습니다.</td></tr>';
    }
    var partnerSum = (p.outsourcingCosts||[]).filter(function(o){return o.type==='partner';}).reduce(function(a,o){return a+numOr0(o.amount);},0);
    var freeSum = (p.outsourcingCosts||[]).filter(function(o){return o.type==='freelancer';}).reduce(function(a,o){return a+numOr0(o.amount);},0);

    return '<div class="panel"><h2>외주 내역</h2><p class="sub">협력업체·프리랜서 비용 등록 내역(읽기 전용). 수정/삭제는 입력 메뉴에서 합니다.</p>'+
      '<div class="twrap"><table><thead><tr><th>업체명</th><th>비고</th><th>기준일</th><th class="right">협력업체 비용</th></tr></thead><tbody>'+rows('partner')+
      '<tr class="subtotal"><td colspan="3">협력업체 소계</td><td class="right num">'+won(partnerSum)+'</td></tr></tbody></table></div>'+
      '<div class="twrap" style="margin-top:12px"><table><thead><tr><th>이름</th><th>비고</th><th>기준일</th><th class="right">프리랜서 비용</th></tr></thead><tbody>'+rows('freelancer')+
      '<tr class="subtotal"><td colspan="3">프리랜서 소계</td><td class="right num">'+won(freeSum)+'</td></tr></tbody></table></div></div>';
  }

  function outIndirect(p){
    var rows = (p.indirectCosts||[]).map(function(o){
      return '<tr><td>'+esc(o.categoryName)+'</td><td>'+esc(o.basis||'')+'</td><td class="right num">'+o.quantity+'</td><td class="right num">'+won(o.unitPrice)+'</td><td class="right num">'+won(o.amount)+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="5">등록된 간접비 항목이 없습니다.</td></tr>';
    var itemSum = (p.indirectCosts||[]).reduce(function(a,o){return a+numOr0(o.amount);},0);
    var rateSum = 0; (p.assignments||[]).forEach(function(a){ rateSum += computeAssignment(a,p).sga; });

    return '<div class="panel"><h2>간접비 내역</h2><p class="sub">판관비율 기반 자동 배분분과, 항목별로 직접 입력한 간접비를 함께 보여줍니다.</p>'+
      '<div class="costcards">'+
        '<div class="costcard"><div class="k">판관비(요율 기준)</div><div class="v num">'+won(rateSum)+'</div><div class="d">인건비 × 판관비율</div></div>'+
        '<div class="costcard"><div class="k">간접비 항목 합계</div><div class="v num">'+won(itemSum)+'</div><div class="d">사무실임대료·회식비 등</div></div>'+
        '<div class="costcard" style="border-color:var(--info)"><div class="k">간접비 합계</div><div class="v num" style="color:var(--info)">'+won(rateSum+itemSum)+'</div></div>'+
      '</div>'+
      '<div class="twrap"><table><thead><tr><th>항목</th><th>산정기준</th><th class="right">수량</th><th class="right">단가</th><th class="right">금액</th></tr></thead><tbody>'+rows+
      '<tr class="subtotal"><td colspan="4">간접비 항목 소계</td><td class="right num">'+won(itemSum)+'</td></tr></tbody></table></div></div>';
  }

  function outRevisions(p){
    var cost = computeProjectCost(p);
    var revs = (p.costRevisions||[]).slice().sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; });
    var rows = revs.map(function(r){
      return '<div class="ms-row ms-3col"><span class="lbl">'+esc(r.date)+'</span><span>'+esc(r.reason)+'</span><span class="num" style="text-align:right">'+esc(r.by)+'</span></div>';
    }).join('') || '<p class="sub">등록된 변경 이력이 없습니다.</p>';

    return '<div class="panel"><h2>원가 변경이력</h2><p class="sub">원가 산정 근거가 바뀔 때마다(투입 조정, 계약 변경 등) 사유를 기록해 시계열로 남깁니다. 현재 총원가는 '+won(cost.total)+'입니다.</p>'+
      '<form class="inline-add wide" data-form="costRevisionForm">'+
        '<div class="field" style="grid-column:span 3"><label>변경 사유</label><input name="reason" required placeholder="예: 3차년도 QA 인력 투입비율 조정"></div>'+
        '<button class="btn primary" type="submit">현재 시점 스냅샷 저장</button>'+
      '</form>'+
      '<div class="milestones">'+rows+'</div></div>';
  }

  function renderProjectDetail(p){
    var st=projectStatus(p), c=client(p.clientId);
    var mode = S.ui.projectMode || 'input';
    var inputTab = S.ui.projectInputTab || 'basic';
    var outputTab = S.ui.projectOutputTab || 'summary';

    var head = '<div class="backline"><button class="linkbtn" data-action="back-to-projects">&larr; 프로젝트 목록으로</button></div>'+
      '<div class="panel"><div class="panelhead"><h2>'+esc(p.code)+' &middot; '+esc(p.name)+'</h2>'+statusPill(st)+'</div>'+
      '<p class="sub">고객사: '+esc(c?c.name:'-')+' &middot; 담당 PM: '+esc((employee(p.pmId)||{}).name||'-')+' &middot; 기간: '+esc(p.startDate||'미정')+' ~ '+esc(p.endDate||'미정')+'</p></div>';

    var modeTabs = '<div class="modetabs">'+
      '<button class="'+(mode==='input'?'active mi':'')+'" data-action="set-project-mode" data-mode="input"><span class="t">입력</span><span class="s">기본정보 · 일정 · 인력 · 외주 · 간접비 등록</span></button>'+
      '<button class="'+(mode==='output'?'active mo':'')+'" data-action="set-project-mode" data-mode="output"><span class="t">출력</span><span class="s">원가요약 · 인력투입현황 · 외주/간접비 내역 보고서</span></button>'+
    '</div>';

    var linkedPP = p.proposalId? proposal(p.proposalId) : null;

    var body='';
    if(mode==='input'){
      var itabs=[{k:'basic',l:'기본정보'},{k:'labor',l:'인력투입'},{k:'outsourcing',l:'외주비용'},{k:'indirect',l:'간접비'},{k:'contracts',l:'계약관리'},{k:'wbs',l:'WBS/진행현황'}];
      body += '<div class="subtabs">'+itabs.map(function(t){return '<button class="'+(inputTab===t.k?'active':'')+'" data-action="set-project-tab" data-scope="input" data-tab="'+t.k+'">'+t.l+'</button>';}).join('')+'</div>';
      if(linkedPP) body += '<p class="sub" style="margin-top:-6px">입찰 일정·사전영업보고서는 <button class="linkbtn" data-action="open-proposal" data-id="'+linkedPP.id+'">제안관리 &gt; '+esc(linkedPP.code)+'</button> 에서 관리합니다.</p>';
      if(inputTab==='basic') body+=inBasic(p);
      else if(inputTab==='labor') body+=inLabor(p);
      else if(inputTab==='outsourcing') body+=inOutsourcing(p);
      else if(inputTab==='indirect') body+=inIndirect(p);
      else if(inputTab==='contracts') body+=inContracts(p);
      else if(inputTab==='wbs') body+=inWBS(p);
    } else {
      var otabs=[{k:'summary',l:'원가요약'},{k:'matrix',l:'인력투입 현황'},{k:'ledger',l:'외주 내역'},{k:'indirectout',l:'간접비 내역'},{k:'revisions',l:'원가 변경이력'}];
      body += '<div class="subtabs">'+otabs.map(function(t){return '<button class="'+(outputTab===t.k?'active':'')+'" data-action="set-project-tab" data-scope="output" data-tab="'+t.k+'">'+t.l+'</button>';}).join('')+'</div>';
      if(outputTab==='summary') body+=outSummary(p);
      else if(outputTab==='matrix') body+=outMatrix(p);
      else if(outputTab==='ledger') body+=outLedger(p);
      else if(outputTab==='indirectout') body+=outIndirect(p);
      else if(outputTab==='revisions') body+=outRevisions(p);
    }

    return head+modeTabs+body;
  }

  function renderProjects(){
    if(S.ui.currentProjectId && project(S.ui.currentProjectId)) return renderProjectDetail(project(S.ui.currentProjectId));
    return renderProjectsList();
  }

      var logoMark = S.settings.logoDataUri? '<img src="'+S.settings.logoDataUri+'" alt="로고" style="max-height:44px;max-width:180px;width:auto;height:auto;object-fit:contain;flex:none">' : LOGO_SVG.replace(/__SIZE__/g,'32');
      html = '<div class="topbar"><button class="brandmark" data-action="nav" data-view="dashboard">'+logoMark+
        '<span class="word"><b>'+esc(S.settings.siteTitle)+'</b><span>'+esc(S.settings.siteSubtitle)+'</span></span></button>'+

  var MONEY_FIELD_NAMES = ['unitPrice','salary','amount','estimatedBudget','monthlyCost','expectedAmount','sgaFixedAmount'];
  function applyMoneyStep(){
    MONEY_FIELD_NAMES.forEach(function(n){
      var els = document.querySelectorAll('input[type="number"][name="'+n+'"]');
      for(var i=0;i<els.length;i++){ if(!els[i].hasAttribute('step')) els[i].step = '10000'; }
    });
    var dp = document.querySelectorAll('[data-project-field="contractAmount"], [data-project-field="customerBudget"]');
    for(var j=0;j<dp.length;j++){ dp[j].step = '10000'; }

    'analyze-rfp': function(){
      var pp = proposal(S.ui.currentProposalId); if(!pp) return;
      var endpoint = (S.settings.rfpAnalysisEndpoint||'').trim();
      if(!endpoint){ showToast('전체 관리에서 RFP 분석 API 주소를 먼저 설정해주세요.', 'warn'); return; }
      var fileInput = document.querySelector('[data-rfp-file-input]');
      var file = fileInput && fileInput.files && fileInput.files[0];
      if(!file){ showToast('분석할 RFP PDF 파일을 선택해주세요.', 'warn'); return; }
      if(file.type && file.type!=='application/pdf'){ showToast('PDF 파일만 지원합니다.', 'warn'); return; }
      if(typeof fetch!=='function' || typeof FileReader!=='function'){ showToast('이 환경에서는 파일 업로드 분석 기능을 사용할 수 없습니다.', 'warn'); return; }
      S.ui.rfpAnalyzing = true; render();
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result).split(',')[1] || '';
        fetch(endpoint, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({pdfBase64:base64, fileName:file.name})
        }).then(function(res){
          return res.json().then(function(j){ return {ok:res.ok, json:j}; });
        }).then(function(r){
          S.ui.rfpAnalyzing = false;
          if(!r.ok || !r.json || r.json.error){
            showToast('분석 실패: '+((r.json&&r.json.error)||'알 수 없는 오류'), 'warn');
            render(); return;
          }
          applyRfpAnalysisResult(pp, r.json.result);
          save(); render();
          showToast('RFP 분석 결과가 반영되었습니다. 내용을 확인 후 필요 시 수정하세요.');
})['catch'](function(err){
          S.ui.rfpAnalyzing = false; render();
          showToast('분석 요청 중 오류: '+(err&&err.message?err.message:err)+' (API 주소/CORS/네트워크를 확인하세요)', 'warn');
        });
      };
      reader.onerror = function(){ S.ui.rfpAnalyzing=false; render(); showToast('파일을 읽는 중 오류가 발생했습니다.', 'warn'); };
      reader.readAsDataURL(file);
    },

    // ---- 엑셀 다운로드/업로드 (1순위: WBS·인력, 2순위: 인력투입·연구과제예산, 3순위: 협력업체·프리랜서·계약·고객사) ----
    'export-wbs': function(){
      var p = project(S.ui.currentProjectId); if(!p) return;
      var tasks = p.wbs.tasks||[];
      var headers = ['Domain','Activity','Task','시작일','종료일','계획완료율(%)','실제완료율(%)','가중치(%)','담당'];
      var headerRow = headers.concat(['', '기준일(수정 시 계획완료율 자동 재계산)', new Date(p.wbs.reportDate)]);
      var rows = tasks.map(function(t){ return wbsTaskToRow(t, p.wbs.reportDate); });
      var totalRow = ['합계','','','','','','', tasks.reduce(function(a,t){return a+numOr0(t.weight);},0), ''];
      writeFormulaSheet('WBS_'+p.code+'.xlsx', 'WBS', [headerRow].concat(rows).concat([totalRow]), function(ws){
        setDateFmt(ws, 'L1');
        tasks.forEach(function(t, i){
          var r = i+2;
          if(t.startDate) setDateFmt(ws, 'D'+r);
          if(t.endDate) setDateFmt(ws, 'E'+r);
          var planVal = wbsPlannedRate(t, p.wbs.reportDate);
          var f = 'IF(OR(D'+r+'="",E'+r+'=""),0,IF(E'+r+'<=D'+r+',0,IF($L$1<=D'+r+',0,IF($L$1>=E'+r+',100,(($L$1-D'+r+')/(E'+r+'-D'+r+'))*100))))';
          setFormula(ws, 'F'+r, f, planVal);
        });
        var totalRowNum = tasks.length+2;
        var weightSum = tasks.reduce(function(a,t){return a+numOr0(t.weight);},0);
        if(tasks.length>0) setFormula(ws, 'H'+totalRowNum, 'SUM(H2:H'+(totalRowNum-1)+')', weightSum);
      });
    },

      var pp=proposal(fd.get('proposalId')); if(!pp) return;
      var rowIds = (fd.get('rowIds')||'').split(',').filter(function(x){return x;});
      var addedCount = 0;
      rowIds.forEach(function(rid){
        var employeeId = fd.get('employeeId_'+rid);
        if(!employeeId) return;
        var emp = employee(employeeId);
        var ratio = Number(fd.get('ratio_'+rid))||0;
        var months = Number(fd.get('months_'+rid))||0;
        var fundSource = fd.get('fundSource_'+rid)||'gov';
        var laborAmount = emp? emp.unitPrice*(ratio/100)*months : 0;
        pp.rndBudget.items.push({id:uid('rb'), category:'인건비', fundSource:fundSource,
          description:(emp?emp.name:'')+' · 참여율 '+ratio+'% · '+months+'개월', amount:Math.round(laborAmount),
          employeeId:employeeId, participationRatio:ratio, participationMonths:months});
        addedCount++;
        if(fd.get('ins_'+rid)==='on'){
          var pension=Number(fd.get('insPension_'+rid))||0, health=Number(fd.get('insHealth_'+rid))||0, employmentIns=Number(fd.get('insEmployment_'+rid))||0, accident=Number(fd.get('insAccident_'+rid))||0;
          var totalRate = pension+health+employmentIns+accident;
          var insAmount = laborAmount*(totalRate/100);
          pp.rndBudget.items.push({id:uid('rb'), category:'4대보험(회사부담분)', fundSource:fundSource,
            description:'국민연금 '+pension+'%+건강보험 '+health+'%+고용보험 '+employmentIns+'%+산재보험 '+accident+'% (합계 '+totalRate+'%)',
            amount:Math.round(insAmount), employeeId:employeeId});
        }
      });
      if(addedCount===0){ showToast('참여 인력을 1명 이상 선택해주세요.', 'warn'); return; }
      S.ui.rndLaborRows = S.ui.rndLaborRows || {};
      S.ui.rndLaborRows[pp.id] = [rndLaborEmptyRow()];
      save(); render();
      showToast('참여 인력 '+addedCount+'명의 인건비가 비목에 일괄 반영되었습니다.');

    presalesForm: function(fd){

    proposalCostForm: function(fd){
      var pp=proposal(S.ui.currentProposalId); if(!pp) return;

    },
    proposalPersonnelForm: function(fd){

    proposalDocForm: function(fd){

      pp.finalDocs.push({id:uid('fd'), category:fd.get('category'), file:{name:file.name, size:file.size}});

    salesForm: function(fd){
      if(!requireFields(fd, [{name:'clientId', label:'고객사'}])) return;

    },
    salesQuickClientForm: function(fd){
      if(!requireFields(fd, [{name:'name', label:'고객사명'}])) return;
      var data={ id:uid('cli'), name:fd.get('name'), bizNo:fd.get('bizNo'), addr:'', contacts:[] };

    },
    salesUpdateForm: function(fd){
      var sa=salesActivity(fd.get('salesId')); if(!sa) return;
      var mt = fd.get('meetingType');
      var meetingWith = null;
      if(mt==='partner') meetingWith = {type:'partner', partnerId:fd.get('meetingPartnerId')||null};
      else if(mt==='other') meetingWith = {type:'other', otherName:fd.get('meetingOtherName')||''};
