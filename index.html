    },
    assignmentForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return; var employeeId=fd.get('employeeId'); if(!employeeId) return;
      p.assignments.push({id:uid('as'), employeeId:employeeId, ratio:Number(fd.get('ratio'))||100, role:fd.get('role')||'개발'}); save(); render();
    },
    partnerCostForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return; var refId=fd.get('refId'); if(!refId) return;
      var costKind = fd.get('costKind')||'license';
      p.outsourcingCosts.push({id:uid('oc'), type:'partner', refId:refId, solutionId:fd.get('solutionId')||null,
        costKind:costKind, maintenancePeriod: costKind==='maintenance'? (fd.get('maintenancePeriod')||''): '',
        amount:Number(fd.get('amount'))||0, memo:fd.get('memo'), date:new Date().toISOString().slice(0,10)});
      save(); render();
    },
    freelancerCostForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return; var refId=fd.get('refId'); if(!refId) return;
      var monthlyCost=Number(fd.get('monthlyCost'))||0, months=Number(fd.get('months'))||1;
      p.outsourcingCosts.push({id:uid('oc'), type:'freelancer', refId:refId, monthlyCost:monthlyCost, months:months, amount:monthlyCost*months, memo:fd.get('memo'), date:new Date().toISOString().slice(0,10)}); save(); render();
    },
    consortiumMemberForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return;
      p.consortium.members = p.consortium.members||[];
      p.consortium.members.push({id:uid('cm'), partnerId:fd.get('partnerId')||null, role:fd.get('role')||'부사업자', sharePct:Math.max(0,Math.min(100,Number(fd.get('sharePct'))||0))});
      save(); render();
    },
    costRevisionForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return;
      p.costRevisions = p.costRevisions||[];
      p.costRevisions.push({id:uid('rv'), date:new Date().toISOString().slice(0,10), reason:fd.get('reason'), by:currentActorName()});
      save(); render();
    },
    contractForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return;
      if(!requireFields(fd, [{name:'partnerId', label:'협력업체'},{name:'name', label:'계약명'}])) return;
      var files = [];
      var contractDoc = fd.get('contractDoc');
      if(contractDoc && contractDoc.name){ files.push({id:uid('cf'), category:'계약서', name:contractDoc.name, size:contractDoc.size}); }
      var quoteDoc = fd.get('quoteDoc');
      if(quoteDoc && quoteDoc.name){ files.push({id:uid('cf'), category:'견적서', name:quoteDoc.name, size:quoteDoc.size}); }
      var others = fd.getAll('otherDocs');
      others.forEach(function(f){ if(f && f.name){ files.push({id:uid('cf'), category:'기타', name:f.name, size:f.size}); } });
      p.contracts = p.contracts||[];
      p.contracts.push({id:uid('ctr'), partnerId:fd.get('partnerId'), name:fd.get('name'), startDate:fd.get('startDate'),
        endDate:fd.get('endDate'), amount:Number(fd.get('amount'))||0, description:fd.get('description'), files:files,
        createdAt:new Date().toISOString().slice(0,10)});
      save(); render();
      showToast('계약이 등록되었습니다.');
    },
    wbsTaskForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return;
      if(!requireFields(fd, [{name:'domain', label:'Domain'},{name:'activity', label:'Activity'},{name:'name', label:'Task'}])) return;
      p.wbs = p.wbs || {reportDate:new Date().toISOString().slice(0,10), tasks:[]};
      p.wbs.tasks.push({id:uid('wbs'), domain:fd.get('domain'), activity:fd.get('activity'), name:fd.get('name'),
        startDate:fd.get('startDate'), endDate:fd.get('endDate'), actualRate:0, weight:Number(fd.get('weight'))||0, assignee:fd.get('assignee')});
      save(); render();
      showToast('WBS 작업이 추가되었습니다.');
    },
    indirectForm: function(fd){
      var p=project(S.ui.currentProjectId); if(!p) return;
      var code=fd.get('categoryCode'); if(!code) return;
      var cat = INDIRECT_CATEGORIES.filter(function(c){return c.code===code;})[0] || {name:code,basis:''};
      var qty=Number(fd.get('quantity'))||0, unit=Number(fd.get('unitPrice'))||0;
      p.indirectCosts.push({id:uid('ic'), categoryCode:code, categoryName:cat.name, basis:fd.get('basis')||cat.basis, quantity:qty, unitPrice:unit, amount:qty*unit, date:new Date().toISOString().slice(0,10)});
      save(); render();
    }
  };

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]'); if(!btn) return;
    var fn = actions[btn.dataset.action]; if(fn){ e.preventDefault(); fn(btn); }
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]'); if(!form) return;
    e.preventDefault();
    var fn = forms[form.dataset.form]; if(fn) fn(new FormData(form));
  });

  document.addEventListener('change', function(e){
    var el = e.target;

    if(el.matches('[data-dash-period]')){
      if(el.dataset.dashPeriod==='start') S.ui.dashboardPeriodStart=el.value; else S.ui.dashboardPeriodEnd=el.value;
      render(); return;
    }
    if(el.matches('[data-action-select="dashboard-matrix-year"]')){
      S.ui.dashboardMatrixYear = el.value? Number(el.value) : null;
      render(); return;
    }
    if(el.matches('[data-action-select="mtx-year"]')){
      var mtxTarget = el.dataset.target;
      S.ui[mtxTarget+'MtxYear'] = el.value? Number(el.value) : null;
      render(); return;
    }
    if(el.matches('[data-mtx-range]')){
      var rangeTarget = el.dataset.mtxRange;
      var bound = el.dataset.bound;
      S.ui[rangeTarget+'MtxCustom'+(bound==='start'?'Start':'End')] = el.value;
      render(); return;
    }
    if(el.matches('[data-action-select="sales-filter-client"]')){ S.ui.salesFilterClient = el.value||''; render(); return; }
    if(el.matches('[data-action-select="sales-filter-rep"]')){ S.ui.salesFilterRep = el.value||''; render(); return; }
    if(el.matches('[data-action-select="sales-filter-stage"]')){ S.ui.salesFilterStage = el.value||''; render(); return; }

    if(el.matches('[data-persona-select]')){
      S.ui.personaEmployeeId = el.value || null;
      if(el.value) goto('myprofile'); else render();
      return;
    }

    if(el.matches('[data-logo-upload]') && el.files && el.files[0]){
      var logoFile = el.files[0];
      if(logoFile.size > 1500000){ showToast('로고 파일이 너무 큽니다(1.5MB 이하 권장). 더 작은 이미지를 사용해주세요.', 'warn'); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        S.settings.logoDataUri = ev.target.result;
        save(); render(); showToast('로고가 등록되었습니다.');
      };
      reader.readAsDataURL(logoFile);
      return;
    }
    if(el.matches('[data-admin-role-change]')){
      var targetEmp = employee(el.dataset.adminRoleChange);
      if(targetEmp){ targetEmp.systemRole = el.value; save(); render(); showToast(targetEmp.name+'의 권한이 변경되었습니다.'); }
      return;
    }
    if(el.matches('[data-admin-project-sga]')){
      var targetP = project(el.dataset.adminProjectSga);
      if(targetP){ targetP.sgaRate = el.value===''?'':Number(el.value); save(); }
      return;
    }
    if(el.matches('.skill-chip input[type=checkbox]')){
      var chip = el.closest('.skill-chip');
      if(chip) chip.classList.toggle('checked', el.checked);
      return;
    }
    if(el.matches('[data-meeting-type-select]')){
      var form6 = el.closest('form');
      var pf = form6 && form6.querySelector('[data-meeting-partner-field]');
      var of = form6 && form6.querySelector('[data-meeting-other-field]');
      if(pf) pf.style.display = (el.value==='partner')? '' : 'none';
      if(of) of.style.display = (el.value==='other')? '' : 'none';
      return;
    }
    if(el.matches('[data-sgatype-select]')){
      var form5 = el.closest('form');
      var pctField = form5 && form5.querySelector('[data-sga-percent-field]');
      var fixedField = form5 && form5.querySelector('[data-sga-fixed-field]');
      if(pctField) pctField.style.display = (el.value==='fixed')? 'none' : '';
      if(fixedField) fixedField.style.display = (el.value==='fixed')? '' : 'none';
      return;
    }
    if(el.matches('[data-outsourcing-partner-select]')){
      var form7 = el.closest('form');
      var solSel = form7 && form7.querySelector('[name="solutionId"]');
      if(solSel){
        var pt7 = partner(el.value);
        var sols7 = pt7? (pt7.solutions||[]) : [];
        solSel.innerHTML = '<option value="">'+(sols7.length? '선택 안 함(일반 용역비)' : '등록된 솔루션 없음')+'</option>'+
          sols7.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.category)+' - '+esc(s.products)+'</option>'; }).join('');
      }
      return;
    }
    if(el.matches('[data-costkind-select]')){
      var form8 = el.closest('form');
      var mpField = form8 && form8.querySelector('[data-maintenance-period-field]');
      if(mpField) mpField.style.display = (el.value==='maintenance')? '' : 'none';
      return;
    }
    if(el.matches('[data-rnd-org-select],[data-rnd-stage-select]')){
      var form9 = el.closest('form');
      var orgSel9 = form9 && form9.querySelector('[data-rnd-org-select]');
      var stageSel9 = form9 && form9.querySelector('[data-rnd-stage-select]');
      var govInput9 = form9 && form9.querySelector('[name="govRatio"]');
      var cashInput9 = form9 && form9.querySelector('[name="cashOfSelfRatio"]');
      if(orgSel9 && stageSel9){
        var ratio9 = rndDefaultRatio(orgSel9.value, stageSel9.value);
        if(govInput9) govInput9.value = ratio9.govRatio;
        if(cashInput9) cashInput9.value = ratio9.cashOfSelfRatio;
      }
      return;
    }
    if(el.matches('[data-rnd-row-employee],[data-rnd-row-ratio],[data-rnd-row-months]')){
      recomputeRndLaborBatchTotal(el.closest('form'));
      return;
    }
    if(el.matches('[data-rnd-row-ins]')){
      var rowContainer11 = el.closest('[data-rnd-row-container]');
      var insFields11 = rowContainer11 && rowContainer11.querySelector('[data-rnd-row-ins-fields]');
      if(insFields11) insFields11.style.display = el.checked? '' : 'none';
      return;
    }
    if(el.matches('[data-jobtype-select]')){
      var form0 = el.closest('form');
      var cb = form0 && form0.querySelector('[data-nonbillable-check]');
      if(cb && NON_BILLABLE_JOBS.indexOf(el.value)!==-1) cb.checked = true;
      return;
    }

    if(el.matches('[data-indirect-cat]')){
      var chosen = el.options[el.selectedIndex];
      var form = el.closest('form');
      if(chosen && form){
        var unitInput = form.querySelector('[name=unitPrice]');
        var basisInput = form.querySelector('[name=basis]');
        var qtyInput = form.querySelector('[name=quantity]');
        if(unitInput) unitInput.value = chosen.dataset.unit || 0;
        if(basisInput) basisInput.value = chosen.dataset.basis || '';
        if(qtyInput && !qtyInput.value) qtyInput.value = 1;
      }
      return;
    }

    var p = project(S.ui.currentProjectId);
    if(el.matches('[data-wbs-actual]') && p){
      var wt = (p.wbs.tasks||[]).filter(function(t){return t.id===el.dataset.wbsActual;})[0];
      if(wt){ wt.actualRate = Math.max(0, Math.min(100, Number(el.value)||0)); save(); render(); }
      return;
    }
    if(el.matches('[data-wbs-reportdate]') && p){
      p.wbs = p.wbs || {tasks:[]};
      p.wbs.reportDate = el.value;
      save(); render();
      return;
    }
    if(el.matches('[data-project-field]') && p){
      var f = el.dataset.projectField, v = el.value;
      if(f==='contractAmount'||f==='customerBudget') p[f] = (v===''?null:Number(v));
      else if(f==='sgaRate') p[f] = (v===''?'':Number(v));
      else p[f] = v;
      save(); render(); return;
    }
    if(el.matches('[data-project-consortium]') && p){
      var cf = el.dataset.projectConsortium;
      p.consortium = p.consortium || {isConsortium:false, role:'주사업자', members:[]};
      if(cf==='isConsortium') p.consortium.isConsortium = el.checked;
      else p.consortium[cf] = el.value;
      save(); render(); return;
    }
    if(el.matches('[data-consortium-role]') && p){
      var m1 = (p.consortium.members||[]).filter(function(x){return x.id===el.dataset.consortiumRole;})[0];
      if(m1){ m1.role = el.value; save(); render(); }
      return;
    }
    if(el.matches('[data-consortium-share]') && p){
      var m2 = (p.consortium.members||[]).filter(function(x){return x.id===el.dataset.consortiumShare;})[0];
      if(m2){ m2.sharePct = Math.max(0,Math.min(100,Number(el.value)||0)); save(); render(); }
      return;
    }
    if(el.matches('[data-milestone-date]') && p){ p.milestones[el.dataset.milestoneDate].date = el.value; save(); render(); return; }
    if(el.matches('[data-milestone-file]') && p && el.files && el.files[0]){
      var f2 = el.files[0]; p.milestones[el.dataset.milestoneFile].file = {name:f2.name, size:f2.size}; save(); render(); return;
    }

    var pp = proposal(S.ui.currentProposalId);
    if(el.matches('[data-proposal-approver]') && pp){ pp.approverId = el.value || null; save(); return; }
    if(el.matches('[data-proposal-personnel-select]')){
      var empSel = employee(el.value);
      var form4 = el.closest('form');
      var salField = form4 && form4.querySelector('[data-proposal-personnel-salary]');
      if(salField) salField.value = empSel? won(empSel.salary) : '';
      return;
    }
    if(el.matches('[data-proposal-milestone-date]') && pp){ pp.milestones[el.dataset.proposalMilestoneDate].date = el.value; save(); render(); return; }
    if(el.matches('[data-proposal-milestone-file]') && pp && el.files && el.files[0]){
      var f3 = el.files[0];
      var ms3 = pp.milestones[el.dataset.proposalMilestoneFile];
      ms3.files = ms3.files || (ms3.file? [ms3.file] : []);
      ms3.files.push({name:f3.name, size:f3.size});
      ms3.file = null;
      save(); render(); return;
    }

    if(el.matches('[data-salary-input]')){
      var form1 = el.closest('form');
      var up = form1 && form1.querySelector('[name=unitPrice]');
      if(up){ var sal=Number(el.value)||0; up.value = sal? Math.round(sal/12) : ''; }
      return;
    }
    if(el.matches('[data-assign-ratio]') && p){
      var a = p.assignments.filter(function(x){return x.id===el.dataset.assignRatio;})[0];
      if(a){ a.ratio = Math.max(1, Math.min(100, Number(el.value)||1)); save(); render(); }
      return;
    }
    if(el.matches('[data-assign-role]') && p){
      var a2 = p.assignments.filter(function(x){return x.id===el.dataset.assignRole;})[0];
      if(a2){ a2.role = el.value; save(); render(); }
      return;
    }
  });

  render();
})();
</script>
